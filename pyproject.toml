[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ralph-dev"
version = "0.1.0"
description = "Project-agnostic AI execution layer for software delivery workflows."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "python-dotenv",
]

[project.scripts]
ralph = "ralph.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "overnight_smoke: fast unattended verification profile for Ralph's own repo; covers shell helpers, bot command parsing, and core auto-mode guards without full integration tests",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ralph = [
  "resources/.env.example",
  "resources/*.sh",
  "resources/scripts/*.py",
  "resources/templates/*",
  "resources/templates/memory/*",
]
