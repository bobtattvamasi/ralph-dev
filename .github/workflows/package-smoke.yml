name: package smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package-smoke:
    name: package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Ensure Git Bash is on PATH on Windows
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\Git\bin" >> "$GITHUB_PATH"

      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      - name: CLI help smoke
        run: ralph --help

      - name: Packaging smoke tests
        run: python -m pytest tests/test_cli_packaging.py -q
